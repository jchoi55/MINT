<svg width="420" height="380" viewBox="0 0 420 380" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MINT logo</title>
  <desc id="desc">Single collider ring with tangent neutrino sprays illustrating muon decay.</desc>

  <defs>
