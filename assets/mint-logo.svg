    <text x="160" y="156" fill="#0B3A53" font-family="Inter, Avenir, Segoe UI, Helvetica, Arial, sans-serif" font-size="132" font-weight="700" text-anchor="middle" dominant-baseline="middle">μ</text>

    <path d="M 244 156 A 84 84 0 0 0 204 84" fill="none" stroke="#0B3A53" stroke-width="4" marker-end="url(#arrowHeadSmall)"/>
    <path d="M 76 156 A 84 84 0 0 0 116 228" fill="none" stroke="#0B3A53" stroke-width="4" marker-end="url(#arrowHeadSmall)"/>

    <line x1="278" y1="156" x2="278" y2="6" stroke="#13A77B" stroke-width="6" marker-end="url(#arrowHead)"/>

    <line x1="243" y1="239" x2="342" y2="140" stroke="#13A77B" stroke-width="6" marker-end="url(#arrowHead)"/>

    <line x1="160" y1="274" x2="310" y2="274" stroke="#13A77B" stroke-width="6" marker-end="url(#arrowHead)"/>

    <line x1="77" y1="239" x2="176" y2="338" stroke="#13A77B" stroke-width="6" marker-end="url(#arrowHead)"/>

    <line x1="42" y1="156" x2="42" y2="306" stroke="#13A77B" stroke-width="6" marker-end="url(#arrowHead)"/>

    <line x1="77" y1="73" x2="-8" y2="158" stroke="#13A77B" stroke-width="6" marker-end="url(#arrowHead)"/>

