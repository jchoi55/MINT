[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mint-muc"
dynamic = ["version"]
description = "Muon Induced Neutrino Tool (MINT): neutrino fluxes for muon facilities"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "Matheus Hostert", email = "matheus-hostert@uiowa.edu" },
  { name = "Joel Choi" },
]
keywords = ["physics", "neutrino", "muon", "collider", "simulation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "vegas>=6.2",
  "vector>=1.6",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "twine>=6.1",
  "ruff>=0.4",
  "jupyter",
  "pytest>=8",
  "pytest-cov>=5",
]
# The in-house CT18 cross-section backend (mint.lo_dis / use_backend("ct18"))
ct18 = [
  "parton",
]
# Extra tools used by the physics case studies in physics-examples/
# (deliberately NOT dependencies of mint itself)
examples = [
  "DarkNews",
  "parton",
  "nupyprop",
]

[project.urls]
Homepage = "https://github.com/jchoi55/MINT"
Repository = "https://github.com/jchoi55/MINT"
Issues = "https://github.com/jchoi55/MINT/issues"

[tool.setuptools_scm]
version_file = "mint/_version.py"
# A tarball with no git metadata still needs a version to install with.
fallback_version = "0.3.0"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["mint*"]

[tool.setuptools.package-data]
mint = [
  "xsec_data/**/*",
  "lattice_data/*",
]

[tool.setuptools.exclude-package-data]
"*" = ["**/.DS_Store", ".DS_Store", "**/*.pyc", "**/__pycache__/**"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "NPY"]
ignore = [
  "E501",    # line length is handled by the formatter, not the linter
  # Legacy np.random.* calls in the event generator. Moving to a Generator
  # would change the random stream, and therefore every published number, so
  # it is deliberately deferred to a release where results are regenerated.
  "NPY002",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::PendingDeprecationWarning"]

[tool.coverage.run]
source = ["mint"]
omit = ["mint/_version.py"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
