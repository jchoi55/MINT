[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mint-muc"
version = "0.3.0"
description = "Muon Induced Neutrino Tool (MINT): neutrino fluxes for muon facilities"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "Matheus Hostert", email = "matheus-hostert@uiowa.edu" },
]
keywords = ["physics", "neutrino", "muon", "collider", "simulation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "vegas>=6.2",
  "vector>=1.6",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "twine>=6.1",
  "ruff>=0.4",
  "jupyter",
]
# The in-house CT18 cross-section backend (mint.lo_dis / use_backend("ct18"))
ct18 = [
  "parton",
]
# Extra tools used by the physics case studies in physics-examples/
# (deliberately NOT dependencies of mint itself)
examples = [
  "DarkNews",
  "parton",
  "nupyprop",
]

[project.urls]
Homepage = "https://github.com/mhostert/MINT"
Repository = "https://github.com/mhostert/MINT"
Issues = "https://github.com/mhostert/MINT/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["mint*"]

[tool.setuptools.package-data]
mint = [
  "xsec_data/**/*",
  "lattice_data/*",
]

[tool.setuptools.exclude-package-data]
"*" = ["**/.DS_Store", ".DS_Store", "**/*.pyc", "**/__pycache__/**"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "NPY"]
ignore = ["E501"]
