[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mint-muc"
version = "0.0.1"
description = "Muon Induced Neutrino Tool (MINT): neutrino fluxes for muon facilities"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "" }
]
keywords = ["physics", "neutrino", "muon", "collider", "simulation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=2.2",
  "packaging>=25",
  "pandas>=2.2",
  "scipy>=1.13",
  "vegas>=6.2",
  "vector>=1.6",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "twine>=6.1",
]

[project.urls]
Homepage = "https://github.com/jchoi55/MINT"
Repository = "https://github.com/jchoi55/MINT"
Issues = "https://github.com/jchoi55/MINT/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["mint*"]

[tool.setuptools.package-data]
mint = [
  "xsec_data/**/*",
]
